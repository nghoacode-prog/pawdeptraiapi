# Render Free chỉ hỗ trợ web service. Worker/cron/disk đầy đủ nằm ở render.paid.yaml.
services:
  - type: web
    name: pawnova-free-preview
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_PATH
        value: /tmp/pawnova.db
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RUN_WORKER_IN_WEB
        value: "1"
